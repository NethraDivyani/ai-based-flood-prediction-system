{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-5">
            <div class="auth-card">
                <h2 class="fw-bold text-center mb-2">Admin Login</h2>
                <p class="text-muted text-center mb-4">Sign in to manage data, subscriptions, and flood alerts</p>

                <form method="POST" action="{{ url_for('auth.admin_login') }}">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Username</label>
                        <input type="text" name="username" class="form-control form-control-lg rounded-4" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">Password</label>
                        <input type="password" name="password" class="form-control form-control-lg rounded-4" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 btn-lg rounded-pill">Login</button>
                </form>

                <div class="text-center mt-4">
                    <span class="text-muted">No account?</span>
                    <a href="{{ url_for('auth.admin_register') }}" class="fw-semibold text-decoration-none"> Register here</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
