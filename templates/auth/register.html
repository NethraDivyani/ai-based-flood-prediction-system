{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="auth-card">
                <h2 class="fw-bold text-center mb-2">Admin Registration</h2>
                <p class="text-muted text-center mb-4">Create an admin account for the system</p>

                <form method="POST" action="{{ url_for('auth.admin_register') }}">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Full Name</label>
                        <input type="text" name="full_name" class="form-control form-control-lg rounded-4" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Username</label>
                        <input type="text" name="username" class="form-control form-control-lg rounded-4" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Email</label>
                        <input type="email" name="email" class="form-control form-control-lg rounded-4" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">Password</label>
                        <input type="password" name="password" class="form-control form-control-lg rounded-4" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 btn-lg rounded-pill">Register</button>
                </form>

                <div class="text-center mt-4">
                    <a href="{{ url_for('auth.admin_login') }}" class="fw-semibold text-decoration-none">Back to login</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
